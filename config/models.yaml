# Model aliases used by protocols. Panel choice is Rex's decision (§14.3).
# knowledge_cutoff drives the post-cutoff temporal holdout slice (§4.3).
# params are sent to the provider (Haiku 4.5 rejects effort, so it has none).
# Locked path for the experimenter: it may reference aliases but not add or edit them.
models:
  claude-opus:
    provider: anthropic
    id: claude-opus-5-5
    family: claude
    knowledge_cutoff: PLACEHOLDER
    vision: true
    params: {effort: low}   # protocols may override per agent
  claude-sonnet:
    provider: anthropic
    id: claude-sonnet-5-5
    family: claude
    knowledge_cutoff: PLACEHOLDER
    vision: true
    params: {effort: low}
  claude-haiku:
    provider: anthropic
    id: claude-haiku-4-5
    family: claude
    knowledge_cutoff: PLACEHOLDER
    vision: true
  grok:
    provider: xai
    id: grok-4.7
    family: grok
    knowledge_cutoff: PLACEHOLDER
    vision: false
  grok-fast:
    provider: xai
    id: grok-4.7-fast      # confirm current fast model id
    family: grok
    knowledge_cutoff: PLACEHOLDER
    vision: false
# Cheap models for rubric scoring, reply triage and the five-second test.
roles:
  rubric_judge: claude-haiku
  reply_triage: claude-haiku
  glance_reader: claude-haiku
  social_writer: grok-fast
