id: chateval-panel-summarizer
description: ChatEval persona panel, simultaneous-talk-with-summarizer mode. Persona judges answer in
  parallel; a summarizer condenses each round into the shared history; majority of final-round verdicts.
pattern: chateval
paper: 04-chan-2023-chateval
controls:
- chateval-panel
- chateval-panel-same-persona
tags:
- season0
- z6
evidence:
  retrieve: true
  max_sources: 6
  per_agent: shared
agents:
- role: judge
  model: claude-sonnet
  name: critic
  persona: Critic. Question the other referees' judgments to make sure they are well-considered; probe
    weak reasoning, overstated sources and missing context, and offer an alternative reading when the
    case looks evenly balanced.
- role: judge
  model: claude-sonnet
  name: news-author
  persona: 'News Author. Focus on consistency with the original sources: check that each claim element
    is actually stated in the evidence, with the right numbers, dates, people and scope.'
- role: judge
  model: claude-sonnet
  name: scientist
  persona: Scientist. A professional with a strong background in the scientific method, critical thinking
    and problem-solving; weigh the quality and independence of sources and whether the evidence truly
    supports the conclusion.
- role: summarizer
  model: claude-sonnet
  name: summarizer
rounds: 2
communication: simultaneous_summarizer
aggregation: majority
