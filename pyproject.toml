[project]
name = "consensus-lab"
version = "0.1.0"
description = "An autonomous experimenter for multi-model consensus on human-judged claims."
requires-python = ">=3.12"
dependencies = [
  "pyyaml>=6",
  "httpx>=0.27",
  "jsonschema>=4.22",
  "python-dotenv>=1.0",
  "numpy>=1.26",
  "anthropic>=1.11.0",
]

[project.optional-dependencies]
viz = ["playwright>=1.45"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lab", "social", "viz", "harness"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: hits real APIs; skipped unless CL_LIVE=1"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
