id: z1-with-evidence
description: One model (claude-sonnet), one answer, with retrieved evidence. A baseline every protocol
  must beat.
pattern: single
tags:
- baseline
- z1
- zone-template
evidence:
  retrieve: true
  max_sources: 6
  per_agent: shared
agents:
- role: answerer
  model: claude-sonnet
aggregation: majority
output:
  rationale_words: 60
