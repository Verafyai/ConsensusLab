<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Consensus Lab</title>
  <link rel="stylesheet" href="./static/style.css">
  <script type="module" src="./static/app.js"></script>
</head>
<body>
  <header class="top">
    <div class="top-inner">
      <div class="brand">Consensus Lab <span>performance</span></div>
      <div class="top-meta">
        <span id="mode" class="mode">Loading…</span>
        <span id="health" class="health"><span class="dot" aria-hidden="true"></span>checking…</span>
        <span id="generated"></span>
      </div>
    </div>
  </header>
  <nav class="tabs" aria-label="Views"><div class="inner" id="tabs"></div></nav>
  <main id="main"></main>
  <footer class="foot">Every score links to the result file it came from. Holdout items and transcripts are never shown; only aggregate holdout scores are.</footer>
</body>
</html>
